name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install git+https://github.com/crunchdomo/srcgraph@v0.1.0
      - run: pip install -e '.[dev]'
      - run: pytest
      - run: adrgraph check --exclude tests/fixtures
      - run: adrgraph audit --strict --exclude tests/fixtures
