[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adrgraph"
dynamic = ["version"]
description = "Enforce architecture decision records against a knowledge graph of your codebase"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "srcgraph>=0.1,<0.2",
    "python-frontmatter==1.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
adrgraph = "adrgraph.cli:main"

[tool.setuptools.packages.find]
include = ["adrgraph*"]

[tool.setuptools.dynamic]
version = { attr = "adrgraph.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
